[project]
name = "mcp-ipinfo"
version = "0.3.0"
description = "IP intelligence MCP server with geolocation, ASN, company, and privacy detection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "NimbleBrain Inc", email = "hello@nimblebrain.ai" },
]
keywords = ["mcp", "ipinfo", "geolocation", "ip-intelligence", "asn", "whois"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiohttp>=3.13.2",
    "fastmcp>=2.14.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.49.1",
    "uvicorn>=0.34.0",
]

[project.urls]
Homepage = "https://github.com/NimbleBrainInc/mcp-ipinfo"
Repository = "https://github.com/NimbleBrainInc/mcp-ipinfo"
Issues = "https://github.com/NimbleBrainInc/mcp-ipinfo/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ipinfo"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long - handled by formatter
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
ignore_missing_imports = true
no_implicit_reexport = true
check_untyped_defs = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
disable_error_code = ["unused-coroutine", "misc"]

[dependency-groups]
dev = [
    "anthropic>=0.79.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]
